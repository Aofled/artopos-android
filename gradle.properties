# =====================================================================================
# WARNING: HIGH MEMORY (RAM) USAGE
# Current settings allocate up to 12 GB of RAM (8 GB Gradle + 4 GB Kotlin Daemon).
# Minimum recommended PC RAM: 16 GB (32 GB is highly recommended).
# If your system freezes, reduce these values locally:
# org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8
# kotlin.daemon.jvmargs=-Xmx2048m
# =====================================================================================

# Gradle Core
org.gradle.jvmargs=-Xmx8192m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# Isolated Projects — incubating в Gradle 9.7+
org.gradle.isolated-projects=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Detekt auto-correction on analysis.
detekt.autocorrect=true

# Project version properties.
ARTOPOS_VERSION_CODE=2
ARTOPOS_VERSION_NAME=1.0.1
