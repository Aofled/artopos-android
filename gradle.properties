# =====================================================================================
# DEFAULT MEMORY SETTINGS
# Safe baseline for machines with 8-16 GB RAM (Total footprint ~4.5 GB).
# To override for high-spec workstations locally, define org.gradle.jvmargs in:
# ~/.gradle/gradle.properties
# =====================================================================================

# Gradle Core & JVM
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# Build Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# Isolated Projects — incubating feature in Gradle 9.7+
org.gradle.isolated-projects=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Detekt auto-correction on analysis (disabled by default for read-only checks)
detekt.autocorrect=false

# Project version properties.
ARTOPOS_VERSION_CODE=2
ARTOPOS_VERSION_NAME=1.0.1
