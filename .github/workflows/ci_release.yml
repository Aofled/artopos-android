name: Release CI

# Run the pipeline ONLY when creating tags that start with 'v' (e.g. v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Force Node.js 24 for all tasks
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build & Sign Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Versioning
        id: versioning
        # github.ref_name (Version Name) contains the tag name (e.g. v1.0.3). Stripping off the 'v' yields 1.0.3.
        # github.run_number (Version Code) - This is a unique build number on GitHub (it goes in order: 1, 2, 3...)
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Prepare Secrets (API Key, Firebase & Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "HARVARD_API_KEY=${{ secrets.RELEASE_API_KEY }}" > ./local.properties
          
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Sign AAB
        env:
          KEYSTORE_PATH: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PARTOPOS_VERSION_CODE=${{ env.VERSION_CODE }} -PARTOPOS_VERSION_NAME=${{ env.VERSION_NAME }}

      - name: Send AAB to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. Find the generated AAB file in the releases folder
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          # Check if the file was found
          if [ -z "$AAB_FILE" ]; then
          echo "❌ AAB file not found!"
          exit 1
          fi
          
          # 2. Generate a signature with a version
          CAPTION="🚀 <b>Artopos Release is Ready!</b>
          
          #3. Send a file via the Telegram Bot API
          <b>Version Name:</b> ${{ env.VERSION_NAME }}
          <b>Version Code:</b> ${{ env.VERSION_CODE }}"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
          -F chat_id="${CHAT_ID}" \
          -F document=@"$AAB_FILE" \
          -F caption="${CAPTION}" \
          -F parse_mode="HTML"

          - name: Create Secure Zip
            if: always()
            env:
              ZIP_PASS: ${{ secrets.ARCHIVE_PASSWORD }}
            run: |
              AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

              if [ -z "$ZIP_PASS" ]; then
                echo "❌ Secret ARCHIVE_PASSWORD is empty in GitHub Settings!"
                exit 1
              fi

              # Pack the AAB into an archive with a password
              zip -P "$ZIP_PASS" -j Artopos-Release.zip "$AAB_FILE"

          - name: Upload Secure AAB to GitHub
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: Artopos-Secure-Release-${{ env.VERSION_NAME }}
              path: Artopos-Release.zip
              retention-days: 1
