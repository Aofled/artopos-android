name: Release CI

# Run the pipeline ONLY when creating tags that start with 'v' (e.g. v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Force Node.js 24 for all tasks
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build & Sign Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Versioning
        id: versioning
        # github.ref_name (Version Name) contains the tag name (e.g. v1.0.3). Stripping off the 'v' yields 1.0.3.
        # github.run_number (Version Code) - This is a unique build number on GitHub (it goes in order: 1, 2, 3...)
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Prepare Secrets (API Key, Firebase & Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "HARVARD_API_KEY=${{ secrets.RELEASE_API_KEY }}" > ./local.properties
          
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Sign AAB
        env:
          KEYSTORE_PATH: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PARTOPOS_VERSION_CODE=${{ env.VERSION_CODE }} -PARTOPOS_VERSION_NAME=${{ env.VERSION_NAME }}

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Artopos-Release-${{ env.VERSION_NAME }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 1 # Delete after 1 days
