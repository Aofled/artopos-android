name: Debug CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Force Node.js 24 for all tasks & Limit Gradle memory for GitHub Actions runner (7GB limit)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvmargs=-Xmx1536m -Dorg.gradle.workers.max=2"

jobs:
  detekt:
    name: Detekt Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew detektAll --no-daemon

      - name: Upload Detekt Reports
        if: always() # We save reports even if the analysis fails (to view errors)
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'

  lint:
    name: Android Lint Analysis
    runs-on: ubuntu-latest
    needs: detekt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Lint requires project to compile, so secrets are needed
      - name: Prepare Secrets (API Key & Firebase)
        run: |
          echo "HARVARD_API_KEY=${{ secrets.DEBUG_API_KEY }}" > ./local.properties
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Secrets (API Key & Firebase)
        run: |
          echo "HARVARD_API_KEY=${{ secrets.DEBUG_API_KEY }}" > ./local.properties
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Reports
        if: always() # Save HTML test reports for easy viewing in a browser
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Secrets (API Key & Firebase)
        run: |
          echo "HARVARD_API_KEY=${{ secrets.DEBUG_API_KEY }}" > ./local.properties
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  notify:
    name: Send Telegram Report
    runs-on: ubuntu-latest
    # We are waiting for all three tasks to be completed.
    needs: [ detekt, lint, test, build ]
    # always() ensures that the message is sent even if detect or test fails.
    if: always()
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
    steps:
      - name: Parse Results and Send to Telegram
        run: |
          get_status() {
            case "$1" in
              "success") echo "✅ Passed" ;;
              "failure") echo "❌ Failed" ;;
              "skipped") echo "⚠️ Skipped" ;;
              "cancelled") echo "🛑 Cancelled" ;;
              *) echo "❓ Unknown" ;;
            esac
          }
          
          DETEKT_STATUS=$(get_status '${{ needs.detekt.result }}')
          LINT_STATUS=$(get_status '${{ needs.lint.result }}')
          TEST_STATUS=$(get_status '${{ needs.test.result }}')
          BUILD_STATUS=$(get_status '${{ needs.build.result }}')
          
          # Calculate the global status
          if [ "${{ needs.detekt.result }}" == "success" ] && [ "${{ needs.lint.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            HEADER="🟢 <b>Artopos CI: SUCCESS</b>"
          else
            HEADER="🔴 <b>Artopos CI: FAILED</b>"
          fi
          
          # 1. Split the commit message into Header (1st line) and Details (the rest)
          COMMIT_TITLE=$(echo "$COMMIT_MSG" | head -n 1)
          COMMIT_BODY=$(echo "$COMMIT_MSG" | tail -n +2 | sed '/^$/d')

          # 2. Escape special characters for Telegram HTML markup to prevent the bot from crashing
          escape_html() {
            echo "$1" | sed 's/&/&amp;/g' | sed 's/</\&lt;/g' | sed 's/>/\&gt;/g'
          }
          SAFE_TITLE=$(escape_html "$COMMIT_TITLE")
          SAFE_BODY=$(escape_html "$COMMIT_BODY")

          # 3. Form a commit block
          COMMIT_LINK="<a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">View on GitHub</a>"
          
          COMMIT_BLOCK="$SAFE_TITLE"
          if [ -n "$SAFE_BODY" ]; then
            COMMIT_BLOCK="$COMMIT_BLOCK
          <i>$SAFE_BODY</i>"
          fi

          # 4. Compile the final message
          MESSAGE="${HEADER}
          
          <b>Branch:</b> ${{ github.ref_name }}
          <b>Commit:</b> ${COMMIT_LINK}
          
          ${COMMIT_BLOCK}

          <b>Results:</b>
          1. Detekt: ${DETEKT_STATUS}
          2. Android Lint: ${LINT_STATUS}
          3. Unit Tests: ${TEST_STATUS}
          4. Debug Build: ${BUILD_STATUS}"
          
          # Send to Telegram
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"
